<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- نمط سند الهندسي: 4 أعمدة × 5 صفوف، كل مربع 100×100 -->

  <!-- صف 1 / عمود 1 -->
