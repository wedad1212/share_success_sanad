    <rect width="100" height="100" fill="#0e065a" stroke="#0e065a" stroke-width="1.2"/>
    <g transform="rotate(180 50 50)">
      <path d="M0 100A50 50 0 0 1 100 100Z" fill="#00c8c8"/>
    </g>
  </g>

  <!-- صف 1 / عمود 2 -->
  <g transform="translate(100 0)">
    <rect width="100" height="100" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
